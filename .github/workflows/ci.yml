name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        # ubuntu-latest's own repos already carry LLVM/Clang 18 packages
        # (confirmed locally), so this installs directly rather than via
        # apt.llvm.org's llvm.sh, which is slower and occasionally flaky in
        # CI. libpolly-18-dev is required too: CMakeLists.txt links the
        # Passes/ipo components, which pull in libPolly.a.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev clang-18 libpolly-18-dev libedit-dev zlib1g-dev ninja-build
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "$GITHUB_ENV"

          # Codegen.h/Linker.h invoke `lli` (and, for -o/link builds,
          # `clang++-13`) unversioned/hardcoded rather than looking up
          # whatever LLVM version is actually installed -- a known issue
          # (see the project hardening plan, Phase 3, item 5). Symlinking
          # here is a CI-environment accommodation, not a source change;
          # the real fix is detecting the linker/tools at runtime.
          sudo ln -sf /usr/bin/lli-18 /usr/local/bin/lli

      - name: Cache LLVM Windows SDK
        if: runner.os == 'Windows'
        id: cache-llvm-windows
        uses: actions/cache@v4
        with:
          path: C:\llvm-sdk
          key: llvm-windows-sdk-18.1.8

      - name: Cache vcpkg libxml2
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\packages
          key: vcpkg-libxml2-x64-windows-1

      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # The official LLVM Windows installer (and Chocolatey's llvm
        # package, which wraps the same installer) ships clang/lld tools
        # only -- no LLVMConfig.cmake, no static libs (confirmed locally and
        # in earlier CI runs: find_package(LLVM CONFIG) fails against it).
        # The "clang+llvm-*-windows-msvc" release archive is LLVM's actual
        # dev SDK distribution for Windows and has both. It's ~950MB, so
        # it's cached (see the step above) rather than re-downloaded and
        # re-extracted on every run.
        run: |
          if (-not (Test-Path "C:\llvm-sdk\lib\cmake\llvm\LLVMConfig.cmake")) {
            $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
            Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm.tar.xz"
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\llvm-extract" | Out-Null
            tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:RUNNER_TEMP\llvm-extract"
            $extracted = Get-ChildItem -Path "$env:RUNNER_TEMP\llvm-extract" -Directory -Filter "clang+llvm-*" | Select-Object -First 1 -ExpandProperty FullName
            New-Item -ItemType Directory -Force -Path "C:\llvm-sdk" | Out-Null
            Move-Item -Path "$extracted\*" -Destination "C:\llvm-sdk" -Force
          }
          echo "LLVM_DIR=C:\llvm-sdk\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\llvm-sdk\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # LLVMExports.cmake's link interface for LLVMWindowsManifest
          # requires a LibXml2::LibXml2 target to exist, even though Pudl
          # itself never touches libxml2 -- install it via the vcpkg that
          # windows-latest runners already ship at C:\vcpkg (cached above;
          # building it from source takes several minutes on a cache miss).
          C:\vcpkg\vcpkg.exe install libxml2:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # LLVM's official Windows release bakes an absolute path to the MS
          # DIA SDK from whatever machine built the release (here, a VS2019
          # Professional install that obviously doesn't exist on this
          # runner) into its exported CMake targets, for LLVMDebugInfoPDB --
          # a component Pudl never uses. windows-latest ships its own DIA
          # SDK under the installed VS2022 toolchain; copy diaguids.lib to
          # the exact path LLVM's export expects so the link succeeds.
          $diaTarget = "C:\Program Files (x86)\Microsoft Visual Studio\2019\Professional\DIA SDK\lib\amd64\diaguids.lib"
          $diaSource = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "diaguids.lib" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($diaSource) {
            New-Item -ItemType Directory -Force -Path (Split-Path $diaTarget) | Out-Null
            Copy-Item -Path $diaSource -Destination $diaTarget -Force
          } else {
            Write-Warning "diaguids.lib not found under the installed Visual Studio -- Build may fail needing it"
          }

      - name: Configure
        shell: bash
        run: |
          extra_args=()
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            extra_args+=("-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE")
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # C:\llvm-sdk\bin (added to PATH above, so `lli` is resolvable
            # for the Test step) also contains clang++.exe, which CMake's
            # Ninja-generator compiler detection happily picks up before
            # cl.exe. That specific clang (18) is too old for this runner's
            # MSVC STL (it demands Clang 20+ when compiling via clang-cl),
            # and mixing MSVC's Ninja setup with clang++ isn't the point
            # here anyway -- force MSVC explicitly.
            extra_args+=("-DCMAKE_C_COMPILER=cl.exe" "-DCMAKE_CXX_COMPILER=cl.exe")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_DIR" "${extra_args[@]}"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
