name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        # ubuntu-latest's own repos already carry LLVM/Clang 18 packages
        # (confirmed locally), so this installs directly rather than via
        # apt.llvm.org's llvm.sh, which is slower and occasionally flaky in
        # CI. libpolly-18-dev is required too: CMakeLists.txt links the
        # Passes/ipo components, which pull in libPolly.a.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev clang-18 libpolly-18-dev libedit-dev zlib1g-dev ninja-build
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # The official LLVM Windows installer (and Chocolatey's llvm
        # package, which wraps the same installer) ships clang/lld tools
        # only -- no LLVMConfig.cmake, no static libs (confirmed locally and
        # in earlier CI runs: find_package(LLVM CONFIG) fails against it).
        # The "clang+llvm-*-windows-msvc" release archive is LLVM's actual
        # dev SDK distribution for Windows and has both.
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm.tar.xz"
          tar -xf "$env:RUNNER_TEMP\llvm.tar.xz" -C "$env:RUNNER_TEMP"
          $llvmDir = Get-ChildItem -Path $env:RUNNER_TEMP -Directory -Filter "clang+llvm-*" | Select-Object -First 1 -ExpandProperty FullName
          echo "LLVM_DIR=$llvmDir\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # LLVMExports.cmake's link interface for LLVMWindowsManifest
          # requires a LibXml2::LibXml2 target to exist, even though Pudl
          # itself never touches libxml2 -- install it via the vcpkg that
          # windows-latest runners already ship at C:\vcpkg.
          C:\vcpkg\vcpkg.exe install libxml2:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: bash
        run: |
          extra_args=()
          if [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]; then
            extra_args+=("-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_DIR" "${extra_args[@]}"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
